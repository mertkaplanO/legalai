<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hukuk AI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        #chatbox {
            width: 80%;
            max-width: 600px;
            margin: 20px auto;
            padding: 10px;
            background: white;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        #messages {
            height: 300px;
            overflow-y: auto;
            border-bottom: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        input, button {
            width: 80%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>Hukuk AI - Avukatınıza Sorun!</h1>
    <div id="chatbox">
        <div id="messages"></div>
        <input type="text" id="question" placeholder="Hukuki sorunuzu yazın..." />
        <button onclick="askQuestion()">Sor</button>
    </div>

    <script>
        async function askQuestion() {
            const question = document.getElementById("question").value;
            if (!question) return;

            const messages = document.getElementById("messages");
            messages.innerHTML += `<p><b>Sen:</b> ${question}</p>`;

            const response = await fetch("/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question })
            });

            const data = await response.json();
            messages.innerHTML += `<p><b>AI:</b> ${data.answer}</p>`;

            document.getElementById("question").value = "";
        }
    </script>

</body>
</html>
